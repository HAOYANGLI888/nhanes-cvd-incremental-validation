analysis_version: survey_ci_locked_v1
method: rao_wu_rescaled_bootstrap
replicates: 2000
seed: 20260715
ci_level: 0.95
ci_method: percentile
batch_size: 20
default_workers: 8
stratum_key:
  - cycle
  - strata
psu_key:
  - cycle
  - strata
  - psu
resampling_rule: sample_n_h_minus_1_psus_with_replacement_within_each_stratum
replicate_multiplier: n_h_over_n_h_minus_1_times_selection_multiplicity
paired_incremental_rule: identical_replicate_factors_and_extended_model_analysis_weight
development_cycles:
  - 2005-2006
  - 2007-2008
  - 2009-2010
  - 2011-2012
  - 2013-2014
  - 2015-2016
  - 2017-2018
forbidden_cycles:
  - 2021-2023
performance_metrics:
  - survey_weighted_AUROC
  - survey_weighted_PR_AUC
  - weighted_Brier
  - weighted_log_loss
  - calibration_intercept
  - calibration_slope
  - observed_expected_ratio
  - weighted_observed_prevalence
  - weighted_mean_predicted_probability
  - calibration_in_the_large
incremental_metrics:
  - delta_AUROC
  - delta_PR_AUC
  - delta_Brier_improvement
  - delta_log_loss_improvement
  - core_calibration_intercept
  - extended_calibration_intercept
  - core_calibration_slope
  - extended_calibration_slope
  - absolute_intercept_deviation_change
  - absolute_slope_deviation_change
minimum_valid_replicate_fraction: 0.95
point_reconciliation_tolerance: 1.0e-7
